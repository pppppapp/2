:root[data-theme="dark"] {

* { box-sizing: border-box; }
body {

.wrap {

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 13px var(--f-body); padding: 5px 11px; border-radius: 999px; cursor: pointer; }

.card {

.qprompt { text-align: center; color: var(--muted); font-size: 13px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 15px var(--f-body); padding: 12px 14px; border-radius: 10px; cursor: pointer; }
.choice.right { border-color: var(--jade); background: var(--jade-soft); color: var(--jade); }
.choice.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.choice:disabled { cursor: default; }
.ex { font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; }
.ex b { font-family: var(--f-han); color: var(--ink); font-weight: 700; font-size: 16px; }

/* List */
.search { width: 100%; font: 15px var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.item { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; padding: 12px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .w { font-family: var(--f-han); font-size: 24px; font-weight: 700; grid-row: span 3; align-self: center; min-width: 3.2em; }
.item .w.k { color: var(--jade); }
.item .m { font-weight: 500; min-width: 0; }
.item .j { font-family: var(--f-mono); font-size: 12.5px; color: var(--red); min-width: 0; overflow-wrap: anywhere; }
.item .hh { font-size: 12.5px; color: var(--muted); min-width: 0; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: up .18s ease-out; }
  @keyframes up { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}

const CATS = [["all","전체"],["place","지명"],["sign","간판"],["notice","표지판"],["food","음식"],["canto","광동어"]];
const CATNAME = Object.fromEntries(CATS);

// 훈음 퀴즈에서 뺄 쉬운 글자
const EASY = new Set("中大小水山口地天田金心手入月出多八西外食頭長花道石門九車所不平市市房室".split(""));

const store = {
  get(k, d) { try { const v = localStorage.getItem("hkhanja:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("hkhanja:" + k, JSON.stringify(v)); } catch {} }
};
const S = {
  tab: store.get("tab", "card"),
  cat: store.get("cat", "all"),
  hideKnown: store.get("hideKnown", false),
  known: new Set(store.get("known", [])),
  order: [], idx: 0, flipped: false,
  q: null, score: { ok: 0, n: 0 },
  search: ""
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; };
const pool = () => RAW.filter(x => S.cat === "all" || x.c === S.cat);
const deckPool = () => pool().filter(x => !(S.hideKnown && S.known.has(x.id)));
const saveKnown = () => store.set("known", [...S.known]);

function hunCells(w) {
  return [...w].map(ch => H[ch]
    ? `<div><span class="c">${ch}</span><span class="h">${esc(H[ch])}</span></div>`
    : CANTO[ch]
      ? `<div class="canto"><span class="c">${ch}</span><span class="h">광동자 · ${esc(CANTO[ch])}</span></div>`
      : `<div><span class="c">${ch}</span><span class="h">–</span></div>`).join("");
}
function hunInline(w) {
  return [...w].map(ch => H[ch] ? `${ch} ${H[ch]}` : CANTO[ch] ? `${ch} (광동자)` : ch).join(" · ");
}

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-HK"; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]HK|yue/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch {}
}
const canSpeak = "speechSynthesis" in window;

function renderChrome() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  const counts = { all: RAW.length };
  RAW.forEach(x => counts[x.c] = (counts[x.c] || 0) + 1);
  $("#chips").innerHTML = CATS.map(([k, v]) =>
    `<button class="chip" data-cat="${k}" aria-pressed="${S.cat === k}">${v}<span class="n">${counts[k]}</span></button>`).join("");
  const p = pool();
  const k = p.filter(x => S.known.has(x.id)).length;
  $("#stat").textContent = `외움 ${k} / ${p.length}`;
}

function newDeck() { S.order = shuffle(deckPool().map(x => x.id)); S.idx = 0; S.flipped = false; }

function renderCard() {
  if (!S.order.length) newDeck();
  const byId = Object.fromEntries(RAW.map(x => [x.id, x]));
  const x = byId[S.order[S.idx]];
  if (!x) {
    $("#main").innerHTML = `<div class="card" style="cursor:default"><div class="empty">이 분류는 다 외웠어요.<br><br><button class="btn small" id="showAll">외운 것도 다시 보기</button></div></div>`;
    $("#showAll").onclick = () => { S.hideKnown = false; store.set("hideKnown", false); newDeck(); render(); };
    return;
  }
  const isK = S.known.has(x.id);
  $("#main").innerHTML = `
    <div class="row">
      <span>${S.idx + 1} / ${S.order.length}</span>
      <label><input type="checkbox" id="hideKnown" ${S.hideKnown ? "checked" : ""}> 외운 카드 숨기기</label>
    </div>
    <div class="card" id="card" tabindex="0" role="button" aria-label="카드 뒤집기">
      <div class="cat"><span>${CATNAME[x.c]}</span>${isK ? '<span class="known">외움</span>' : ""}</div>
      <div class="word ${[...x.w].length > 3 ? "long" : ""}">${x.w}</div>
      ${S.flipped ? `
        <div class="reveal">
          <div class="pron"><span class="jyut">${esc(x.j)}</span>${x.r ? `<span class="rom">${esc(x.r)}</span>` : ""}</div>
          <div class="mean">${esc(x.m)}</div>
          <div class="hun">${hunCells(x.w)}</div>
          ${x.n ? `<div class="note">${esc(x.n)}</div>` : ""}
        </div>` : `<div class="hint">눌러서 훈음·발음 보기</div>`}
    </div>
    <div class="actions">
      <button class="btn no" id="again">다시</button>
      <button class="btn" id="say" ${canSpeak ? "" : "disabled"}>광동어 듣기</button>
      <button class="btn yes" id="got">외웠어요</button>
    </div>`;
  const flip = () => { S.flipped = !S.flipped; renderCard(); };
  $("#card").onclick = flip;
  $("#card").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  $("#hideKnown").onchange = e => { S.hideKnown = e.target.checked; store.set("hideKnown", S.hideKnown); newDeck(); render(); };
  $("#say").onclick = () => speak(x.w);
  const next = () => {
    S.flipped = false;
    if (S.hideKnown) { S.order = S.order.filter(id => !S.known.has(id)); if (S.idx >= S.order.length) S.idx = 0; }
    else S.idx = (S.idx + 1) % S.order.length;
    if (S.idx === 0 && !S.hideKnown) S.order = shuffle(S.order);
    render();
  };
  $("#again").onclick = () => { S.known.delete(x.id); saveKnown(); const id = S.order.splice(S.idx, 1)[0]; S.order.splice(Math.min(S.idx + 3, S.order.length), 0, id); S.flipped = false; render(); };
  $("#got").onclick = () => { S.known.add(x.id); saveKnown(); next(); };
}

function makeWordQ() {
  const p = pool(); if (p.length < 4) return null;
  const x = p[Math.floor(Math.random() * p.length)];
  const others = shuffle(RAW.filter(y => y.m !== x.m)).slice(0, 3);
  return { kind: "word", x, ans: x.m, choices: shuffle([x.m, ...others.map(o => o.m)]), picked: null };
}
function charPool() {
  const set = new Set();
  pool().forEach(x => [...x.w].forEach(ch => { if (H[ch] && !EASY.has(ch)) set.add(ch); }));
  return [...set];
}
function makeCharQ() {
  const cs = charPool(); if (cs.length < 4) return null;
  const ch = cs[Math.floor(Math.random() * cs.length)];
  const all = shuffle(Object.keys(H).filter(c => c !== ch && H[c] !== H[ch] && !EASY.has(c))).slice(0, 3);
  return { kind: "char", ch, ans: H[ch], choices: shuffle([H[ch], ...all.map(c => H[c])]), picked: null };
}

function renderQuiz(kind) {
  if (!S.q || S.q.kind !== kind) S.q = kind === "word" ? makeWordQ() : makeCharQ();
  const q = S.q;
  if (!q) { $("#main").innerHTML = `<div class="qcard"><div class="empty">문제를 만들 단어가 부족해요. 다른 분류를 골라 주세요.</div></div>`; return; }
  const done = q.picked != null;
  const big = q.kind === "word" ? q.x.w : q.ch;
  let after = "";
  if (done) {
    if (q.kind === "word") {
      after = `<div class="pron"><span class="jyut">${esc(q.x.j)}</span>${q.x.r ? `<span class="rom">${esc(q.x.r)}</span>` : ""}</div>
        <div class="hun">${hunCells(q.x.w)}</div>${q.x.n ? `<div class="note">${esc(q.x.n)}</div>` : ""}`;
    } else {
      const ex = RAW.filter(x => x.w.includes(q.ch)).slice(0, 6);
      after = `<div class="ex">${ex.map(x => `<span><b>${x.w}</b> ${esc(x.m)}</span>`).join("")}</div>`;
    }
  }
  $("#main").innerHTML = `
    <div class="row"><span>맞힘 ${S.score.ok} / ${S.score.n}</span><span>${CATNAME[S.cat]}</span></div>
    <div class="qcard">
      <div class="qprompt">${q.kind === "word" ? "뜻이 뭘까요?" : "훈음이 뭘까요?"}</div>
      <div class="word ${[...big].length > 3 ? "long" : ""}">${big}</div>
      <div class="choices">${q.choices.map((c, i) => {
        const cls = done ? (c === q.ans ? "right" : c === q.picked ? "wrong" : "") : "";
        return `<button class="choice ${cls}" data-i="${i}" ${done ? "disabled" : ""}>${esc(c)}</button>`;
      }).join("")}</div>
      ${after}
      <div class="actions" style="grid-template-columns:1fr 1fr">
        <button class="btn" id="say" ${canSpeak ? "" : "disabled"}>광동어 듣기</button>
        <button class="btn yes" id="nextQ" ${done ? "" : "disabled"}>다음 문제</button>
      </div>
    </div>`;
  document.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    q.picked = q.choices[+b.dataset.i];
    S.score.n++; if (q.picked === q.ans) S.score.ok++;
    renderQuiz(kind);
  });
  $("#say").onclick = () => speak(big);
  $("#nextQ").onclick = () => { S.q = null; renderQuiz(kind); };
}

function renderList() {
  const s = S.search.trim().toLowerCase();
  const items = pool().filter(x => !s || [x.w, x.j, x.r, x.m, x.n, hunInline(x.w)].join(" ").toLowerCase().includes(s));
  const active = document.activeElement && document.activeElement.id === "search";
  $("#main").innerHTML = `
    <input class="search" id="search" type="search" placeholder="한자, 뜻, 훈음, 발음으로 찾기" value="${esc(S.search)}">
    <div style="height:10px"></div>
    <div class="list">${items.length ? items.map(x => `
      <div class="item">
        <span class="w ${S.known.has(x.id) ? "k" : ""}">${x.w}</span>
        <span class="m">${esc(x.m)}</span>
        <span class="j">${esc(x.j)}${x.r ? ` · ${esc(x.r)}` : ""}</span>
        <span class="hh">${esc(hunInline(x.w))}</span>
      </div>`).join("") : `<div class="empty">찾는 단어가 없어요.</div>`}</div>`;
  const inp = $("#search");
  inp.oninput = e => { S.search = e.target.value; const pos = e.target.selectionStart; renderList(); const n = $("#search"); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} };
  if (active) inp.focus();
}

function render() {
  renderChrome();
  if (S.tab === "card") renderCard();
  else if (S.tab === "quiz") renderQuiz("word");
  else if (S.tab === "char") renderQuiz("char");
  else renderList();
}

$("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.tab = b.dataset.tab; store.set("tab", S.tab); S.q = null; render(); };
$("#chips").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.cat = b.dataset.cat; store.set("cat", S.cat); newDeck(); S.q = null; render(); };
if (canSpeak) try { speechSynthesis.getVoices(); } catch {}
newDeck();
render();
</script>
